server:
  port: 8080

spring:
  application:
    name: camel-session-0to1
  task:
    execution:
      # Required since ThreadPoolConfig declares an Executor bean (myTaskPool). Boot's
      # applicationTaskExecutor is guarded by @ConditionalOnMissingBean(Executor.class), so ANY
      # user Executor bean makes it back off - and camel-platform-http needs a ThreadPoolTaskExecutor
      # or SimpleAsyncTaskExecutor to serve the REST endpoints, otherwise startup fails with
      # "No ThreadPoolTaskExecutor, SimpleAsyncTaskExecutor or DelegatingSecurityContextAsyncTaskExecutor
      # configured". "force" keeps applicationTaskExecutor alongside the custom pool.
      mode: force
  main:
    banner-mode: off
    # Required. Resolving the XML-defined CamelContext and Camel's *ComponentAutoConfiguration
    # beans forms a constructor-level cycle that @Lazy alone cannot break.
    allow-circular-references: true

# NOTE: the CamelContext of this project is defined in camel-context.xml, so camel-spring-boot's
# auto-configuration has stepped aside. The runtime switches under camel.springboot.*
# (use-mdc-logging / tracing / stream-caching ...) have NO effect here; they must be written as
# attributes of <camelContext>. See the header comment of camel-context.xml.

demo:
  remote:
    # The "external system" API-3 calls through its ProducerTemplate
    # (served by MockRemoteApiController inside this same application).
    base-url: http://localhost:${server.port}

  # ==== OpenAPI groups =======================================================
  # There is one specification (classpath:openapi.yaml, hand-written because springdoc cannot see
  # Camel REST DSL routes) and a group is a filtered view of it: an operation is kept when its tags
  # intersect the group's tags, paths left empty are dropped, and unreferenced schemas are pruned.
  # Each group becomes /openapi/<name>.yaml plus one entry in the Swagger UI definition dropdown.
  #
  # The groups themselves are declared by x-groups INSIDE openapi.yaml, next to the tags they
  # select - that is the place to add or edit one. The list below overrides them entirely when it
  # is non-empty, which is only for a deployment that must publish a different selection than the
  # packaged document describes. A tag that does not exist in the spec fails startup either way.
  openapi:
    spec: classpath:openapi.yaml
    # groups:
    #   - name: business-only
    #     display-name: Business APIs
    #     tags: [API-1 basic, API-2 dispatch]

springdoc:
  api-docs:
    # Must stay enabled: SwaggerUiConfigProperties is @ConditionalOnBean(SpringDocConfiguration),
    # and that configuration is itself guarded by this flag - switching it off takes the whole
    # Swagger UI down with it.
    enabled: true
    path: /v3/api-docs
  # springdoc's scanner only understands @RestController. It cannot see <rest>/<post> in
  # camel/rest-api.xml, so left alone it would publish the two mock controllers as if they were
  # the whole API. Pointing it at a package that holds no controller keeps /v3/api-docs empty and
  # makes the split obvious: everything real is served from openapi.yaml by OpenApiGroupController.
  packages-to-scan: com.example.camel.no-such-package
  swagger-ui:
    path: /swagger-ui.html
    # The dropdown is populated by SwaggerUiGroupConfig from the groups; the display options
    # (filter box, docExpansion, ...) come from x-swagger-ui inside openapi.yaml, because they are
    # a property of that document rather than of this deployment. Anything set here still wins:
    # only options left unset are filled from the spec.
    disable-swagger-default-url: true

# ==== Distributed tracing ====================================================
# spring-boot-starter-actuator + micrometer-tracing-bridge-brave build the Brave tracer;
# camel-observation-starter feeds Camel into it (one span per route and per <to> endpoint).
# Both are plain Spring auto-configurations that take the CamelContext as a constructor
# argument, so - unlike the camel.springboot.* switches - they DO work with the XML-defined
# CamelContext of this project.
management:
  tracing:
    # Sample every request. Fine for a teaching project; lower it in production.
    sampling:
      probability: 1.0
    propagation:
      # W3C "traceparent" header (the default). Camel injects it into outbound HTTP calls, which
      # is how API-3 and MockRemoteApiController end up sharing one traceId.
      type: W3C
  endpoints:
    web:
      exposure:
        include: health,info,metrics


logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%15.15thread] [camel-app,%X{trace_id:-},%X{span_id:-}] [route:%X{camel.routeId:-~}] %cyan(%-40.40logger{39}) : %msg%n"
  level:
    root: INFO
    com.example.camel: INFO
    org.apache.camel: INFO
    # Uncomment to watch spans being opened/closed by the Camel <-> Micrometer bridge
    # org.apache.camel.observation: DEBUG
    # Uncomment to see how the REST endpoints get registered
    # org.apache.camel.component.platform.http: DEBUG
